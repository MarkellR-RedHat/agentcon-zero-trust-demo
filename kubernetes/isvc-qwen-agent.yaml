# The agent model for the live run: Qwen3.8-27B BF16 on ONE 71 GB MIG slice (mig-3g.71gb), the same
# cluster vLLM image the PyTorch demo's Qwen track used (0.24.0+rhaiv.13), with tool calling turned
# on so the agent can call the sandbox's tools. Thinking is off server-side, as in that track.
# Fit: 51.1 GiB of weights on a 69.75 GiB slice; vLLM's 90% budget leaves about 11 GiB of KV cache,
# roughly 160K tokens at 70.6 KB per token, far more than an agent conversation needs. The context is
# capped at 16384 so memory profiling stays well inside the slice. CUDA graphs worked on this slice
# in the PyTorch run (FP8 and INT4 pods); the 35 GB slice fits only the INT4 build and ran eager.
apiVersion: serving.kserve.io/v1beta1
kind: InferenceService
metadata:
  name: qwen-agent
  annotations:
    serving.kserve.io/deploymentMode: RawDeployment
spec:
  predictor:
    minReplicas: 1
    maxReplicas: 1
    containers:
      - name: kserve-container
        image: registry.redhat.io/rhaii/vllm-cuda-rhel9@sha256:c056e61672b6aea489ad5dde0bd2f8497230f5333e87f7cf6c494eba3bfdc808
        args:
          - --port=8080
          - --model=Qwen/Qwen3.8-27B
          - --served-model-name=qwen-agent
          - --max-model-len=16384
          - --enable-auto-tool-choice
          - --tool-call-parser=hermes
          - --default-chat-template-kwargs={"enable_thinking":false}
        env:
          - name: HF_HOME
            value: /tmp/hf_home
        resources:
          requests:
            cpu: 4
            memory: 32Gi
            nvidia.com/mig-3g.71gb: 1
          limits:
            nvidia.com/mig-3g.71gb: 1
---
# OPTIONAL, not needed for the talk: Llama 3.1 8B on a 35 GB MIG slice (mig-2g.35gb), to answer
# "does model size change what the agent does". Uses the llama3_json tool parser. Skip it unless a
# second slice is free; the 18 GB slice is too small for 8B in BF16 once the KV cache is counted.
apiVersion: serving.kserve.io/v1beta1
kind: InferenceService
metadata:
  name: llama8b-agent
  annotations:
    serving.kserve.io/deploymentMode: RawDeployment
spec:
  predictor:
    minReplicas: 1
    maxReplicas: 1
    containers:
      - name: kserve-container
        image: registry.redhat.io/rhaii/vllm-cuda-rhel9@sha256:c056e61672b6aea489ad5dde0bd2f8497230f5333e87f7cf6c494eba3bfdc808
        args:
          - --port=8080
          - --model=meta-llama/Llama-3.1-8B-Instruct
          - --served-model-name=llama8b-agent
          - --max-model-len=16384
          - --enable-auto-tool-choice
          - --tool-call-parser=llama3_json
        env:
          - name: HF_HOME
            value: /tmp/hf_home
        resources:
          requests:
            cpu: 4
            memory: 24Gi
            nvidia.com/mig-2g.35gb: 1
          limits:
            nvidia.com/mig-2g.35gb: 1
