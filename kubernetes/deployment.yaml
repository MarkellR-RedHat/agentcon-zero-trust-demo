apiVersion: apps/v1
kind: Deployment
metadata:
  name: zero-trust-agents-demo
  labels:
    app: zero-trust-agents-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: zero-trust-agents-demo
  template:
    metadata:
      labels:
        app: zero-trust-agents-demo
    spec:
      containers:
        - name: demo
          # the presenter app in replay mode: serves the bundled run data, needs no GPU.
          # Published by CI from main (same pattern as the PyTorch demo's backup image).
          image: ghcr.io/markellr-redhat/agentcon-zero-trust-demo:2026.10
          ports:
            - containerPort: 8000
              protocol: TCP
          env:
            - name: DEMO_MODE
              value: "replay"
            - name: RUNS_DIR
              value: "runs/2026-10-09-qwen-r1"
            - name: PORT
              value: "8000"
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 3
            periodSeconds: 10
